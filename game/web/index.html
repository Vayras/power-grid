<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F5F4">
<meta name="description" content="Power Grid: a Bitcoin mining plant tycoon. Build power, mine blocks, survive halvings, reach free energy.">
<title>Power Grid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">
<link rel="stylesheet" href="style.css?v=38">
</head>
<body>
<canvas id="view" aria-label="The plant, seen from above" role="img"></canvas>

<header id="topbar" hidden>
<div id="hud" hidden>
  <button class="cell" id="h-cash" title="Cash"><span class="lbl">Cash</span><span class="num v">$0</span></button>
  <button class="cell" id="h-btc" title="Sell bitcoin"><span class="lbl">Bitcoin</span><span class="num v">₿ 0</span></button>
  <button class="cell" id="h-spend" title="What you spend per day: power and crew"><span class="lbl">Spend / day</span><span class="num v">$0</span></button>
  <button class="cell" id="h-net" title="What is this?"><span class="lbl">Net / day · profit</span><span class="num v">$0</span></button>
  <button class="cell" id="h-hash" title="Your hashrate, and your share of the network"><span class="lbl">Hashrate</span><span class="num v">0 TH/s</span></button>
  <button class="cell" id="h-pow" title="Toggle the grid view"><span class="lbl">Power</span><span class="num v">0 / 0 kW</span></button>
  <button class="cell" id="h-px" title="What is this?"><span class="lbl">BTC</span><span class="num v">$0</span></button>
</div>

<button id="pill" hidden aria-label="Open the network: mempool, blocks and charts"><span id="p-text"></span><span class="bar"><i id="p-bar"></i></span><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 7h12M2 11h9M2 15h5"/></svg></button>

<div id="rail" hidden>
  <button class="ib" id="b-ledger" aria-label="Ledger: goals and how mining really works" data-n="0"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5l1 1 1-1h5v12H9l-1 1-1-1H2zM8 3v11"/></svg></button>
  <button class="ib" id="b-layers" aria-label="Map view: airflow, grid, security" aria-expanded="false" title="Map view"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6 3-6 3-6-3zM2 8l6 3 6-3M2 11l6 3 6-3"/></svg></button>
  <button class="ib" id="b-sites" aria-label="Your sites around the world" hidden><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 0 .01 0M1 8h14M8 1c-3.5 3.5-3.5 10.5 0 14M8 1c3.5 3.5 3.5 10.5 0 14"/></svg></button>
  <button class="ib" id="b-learn" aria-label="Foreman's notes"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5V3h6v4L8 9v2M8 13v2"/></svg></button>
  <button class="ib" id="b-donate" aria-label="Support the game" title="Support the game"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14L2 8V4l2-2h2l2 2 2-2h2l2 2v4z"/></svg></button>
</div>
<div id="speed" hidden>
  <button class="ib" id="b-play" aria-label="Pause"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg></button>
  <button class="ib" id="b-skip" aria-pressed="false" aria-label="Skip ahead to the next thing that needs you" title="Skip ahead (F): top speed until an event, an alarm, a milestone or the cash for the next rung"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3l5 5-5 5zM8 3l5 5-5 5zM14 3v10"/></svg></button>
  <label class="spd" title="Game speed"><input type="range" id="spd" min="0" max="100" step="1" value="31" aria-label="Game speed" aria-describedby="spd-t"><span id="spd-t" class="num">36 s a day</span></label>
  <button class="ib" id="b-menu" aria-label="Menu"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
</div>
</header>

<aside id="dock" class="glass" hidden>
  <div id="tabs" role="tablist">
    <button role="tab" data-tab="power" aria-selected="true">Power</button>
    <button role="tab" data-tab="miners">Miners</button>
    <button role="tab" data-tab="cooling">Cooling</button>
    <button role="tab" data-tab="site">Site</button>
  </div>
  <div id="items"></div>
  <button id="b-ladder">Power tree</button>
</aside>

<div id="layers" class="glass" hidden>
  <div class="lh">Map view<button class="ib" id="layers-x" aria-label="Close">×</button></div>
  <div id="views" role="group" aria-label="Map views">
      <button data-view="1" aria-pressed="false" title="Airflow: where fans blow and how hot each box is"><span><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5h9V3M1 9h12v2M1 13h6"/></svg></span>Airflow</button>
      <button data-view="2" aria-pressed="false" title="Grid: which things share a power network"><span><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1L3 9h5l-1 6 6-8H8z"/></svg></span>Grid</button>
      <button data-view="4" aria-pressed="false" title="Security: red is reachable by raiders"><span><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h10v6l-5 6-5-6z"/></svg></span>Security</button>
    </div>
</div>

<div id="placebar" class="glass" hidden>
  <span id="pb-text"></span>
  <span id="pb-mode" class="seg mini" role="tablist" aria-label="Buy new or used" hidden></span>
  <button class="btn" id="pb-rot" hidden>↻ Turn</button>
  <button class="btn btn-p" id="pb-ok">Place</button>
  <button class="btn" id="pb-cancel">Cancel</button>
</div>

<div id="inspector" class="glass" hidden></div>
<div id="status" hidden aria-live="polite"></div>
<div id="hovertip" hidden></div>
<button id="np" class="glass" hidden aria-label="Skip to the next song"><span class="lbl">Foreman FM</span><span id="np-t"></span><span id="np-skip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l6 5-6 5zM12 3v10"/></svg></span></button>
<div id="toasts" aria-live="polite"></div>
<div id="why" hidden></div>
<div id="memo" class="memo glass" hidden></div>
<div id="modal-wrap" hidden><div id="modal" class="card" role="dialog" aria-modal="true"></div></div>

<div id="boot"><div class="boot-title">Power Grid</div><div class="boot-bar"><i id="boot-bar"></i></div><div id="boot-msg">Loading the plant…</div></div>

<script src="music.js?v=38"></script>
<script src="history.js?v=38"></script>
<script src="qr.js?v=38"></script>
<script src="game.js?v=38"></script>
<div id="finale" hidden></div>
</body>
</html>
