[package]
name = "power-grid"
version = "0.1.0"
edition = "2021"
description = "Power Grid: a Bitcoin mining plant tycoon in Rust + WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
