# Build the Rust core to WebAssembly and publish game/web to GitHub Pages on every push to main.
# One-time setup: repo Settings › Pages › Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain with the wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            game
            game/tools/sim
      - name: Build game.wasm
        run: ./game/build.sh
      - name: Balance smoke test (Normal must stay winnable)
        working-directory: game/tools/sim
        run: cargo run --release -q -- 20 0 sim | tee sim.txt
      - name: Tree rules (no-river maps, old saves, both roads to the core)
        working-directory: game/tools/sim
        run: cargo run --release -q -- check
      - name: Whole-tree balance (most Normal runs must reach the core)
        working-directory: game/tools/sim
        run: cargo run --release -q -- 15 0 full
      - name: Both branches win on their own (fossil, then renewable)
        working-directory: game/tools/sim
        run: |
          PG_BRANCH=fossil cargo run --release -q -- 10 0 full
          PG_BRANCH=renewable cargo run --release -q -- 10 0 full
      - name: Hard stays winnable
        working-directory: game/tools/sim
        run: cargo run --release -q -- 10 1 full
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
